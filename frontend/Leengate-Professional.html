<style>

:root{
  --bg:#07090e;--panel:#121824;--panel2:#1a212f;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --tx:#f4f5f7;--mut:#8b90a0;--dim:#5d6270;
  --ok:#3ddc84;--warn:#f5a524;--bad:#ff5722;--ai:#ffb800;--ind:#0d9488;--crit:#ff8a3d;
  --gpurple:#5a3d8f;--gpink:#d9607f;--gcoral:#f3936a;--gblob:#232f5e;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;background:#000}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#000;color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.ai{color:var(--ai)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:500;font-size:13px;border:1px solid var(--line2);background:transparent;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.w{background:#fff;color:#000;border-color:#fff}.btn.w:hover{background:#e6e6e6}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}.btn.ai:hover{background:#cc9400}
.btn.sm{padding:6px 11px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:.02em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.tag.sim{color:var(--warn);border-color:rgba(245,165,36,.4)}
.tag.obs{color:var(--ok);border-color:rgba(61,220,132,.4)}
.tag.pred{color:var(--ai);border-color:rgba(255,184,0,.45)}
.tag.tgt{color:#5eead4;border-color:rgba(13,148,136,.5)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1000px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--dim);text-align:left;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .6s}
input[type=range]{width:100%;accent-color:var(--ai)}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:5px}
.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
svg text{font-family:var(--font)}

/* landing */
[hidden]{display:none!important}
.land{position:relative}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px max(24px,5vw);background:rgba(0,0,0,.72);backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.14em;font-size:15px}
.logo svg{width:22px;height:22px}
.nav nav{display:flex;gap:30px;color:var(--mut);font-size:13px}
.nav nav a:hover{color:#fff}
@media(max-width:760px){.nav nav{display:none}}
.hero{position:relative;padding:60px max(24px,5vw) 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;min-height:640px;align-items:center;overflow:hidden}
.heroGrad{background:
  radial-gradient(ellipse 65% 55% at 82% 12%,rgba(243,147,106,.65),transparent 62%),
  radial-gradient(ellipse 60% 55% at 8% 6%,rgba(90,61,143,.75),transparent 58%),
  radial-gradient(ellipse 85% 65% at 42% 105%,rgba(35,47,94,.85),transparent 60%),
  radial-gradient(ellipse 55% 50% at 60% 55%,rgba(217,96,127,.4),transparent 65%),
  linear-gradient(140deg,#3a2a63 0%,#6b3f7e 32%,#c85f78 58%,#f3936a 100%)}
.heroGrad::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse 50% 70% at 30% 50%,rgba(35,47,94,.9),transparent 70%);
  filter:blur(2px);pointer-events:none;mix-blend-mode:multiply;opacity:.6}
.heroGrad h1,.heroGrad .lead{color:#000;text-shadow:none}
.heroGrad .mut{color:rgba(0,0,0,.65)}
.heroGrad .card{background:rgba(10,8,20,.42);border-color:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.heroGrad .btn.w{background:#fff;color:#000;border-color:#fff}
.heroGrad .btn:not(.w):not(.ai){background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.2);color:#000}
.heroGrad .btn.ai{background:linear-gradient(90deg,#f3936a,#d9607f);border-color:transparent}
.gateWrap{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.gatePhoto{position:relative;background-size:cover;background-position:center 30%;display:flex;flex-direction:column;justify-content:space-between;padding:32px}
.gatePhotoScrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,14,.6),rgba(7,9,14,.2) 45%,rgba(7,9,14,.85));z-index:0}
.gatePhotoTop{position:relative;z-index:1}
.gateInset{position:relative;z-index:1;background:rgba(7,9,14,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px;max-width:320px}
.gateInset img{width:100%;border-radius:8px;display:block;margin-bottom:8px}
.gateInset p{font-size:11.5px;color:rgba(255,255,255,.82);margin:0;line-height:1.4}
.gateFormSide{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
@media(max-width:860px){.gateWrap{grid-template-columns:1fr}.gatePhoto{min-height:220px;padding:20px}.gateInset{display:none}}
/* Each department gets a distinct accent so the dashboard is visibly different at a glance -
   the data areas stay the same neutral slate for readability; only the accent changes. */
body.role-supplier{--role:#14b8a6}
body.role-procurement{--role:#ffb800}
body.role-pm{--role:#5b8cff}
body.role-finance{--role:#22c55e}
body.role-engineer{--role:#ff5722}
body.role-admin{--role:#a855f7}
body[class^="role-"] #side{border-right:2px solid var(--role);background:linear-gradient(180deg,color-mix(in srgb,var(--role) 10%,var(--panel)),var(--panel) 55%)}
body[class^="role-"] #side .nv.on{background:color-mix(in srgb,var(--role) 22%,transparent);color:var(--role)}
body[class^="role-"] #roleTag{border-color:var(--role);color:var(--role)}
body[class^="role-"] .top{border-bottom:1px solid color-mix(in srgb,var(--role) 30%,var(--line))}
.hero h1{font-size:clamp(40px,6vw,72px);font-weight:500;letter-spacing:-.035em;line-height:1.02}
.hero p.lead{color:var(--mut);max-width:430px;margin:26px 0 28px;font-size:15px}
.globe{position:relative;height:560px}
.globe canvas{position:absolute;inset:0;width:100%;height:100%}
.float{position:absolute;background:rgba(14,15,20,.82);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;backdrop-filter:blur(8px)}
@media(max-width:900px){.hero{grid-template-columns:1fr}.globe{height:420px}}
.strip{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 max(24px,5vw)}
.strip>div{padding:22px 20px;border-right:1px solid var(--line)}.strip>div:last-child{border:0}
.strip small{display:block;color:var(--mut);font-size:11px;margin-bottom:6px}
.strip b{font-size:26px;font-weight:500;letter-spacing:-.02em}
@media(max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}.strip>div{border-bottom:1px solid var(--line)}}
.sect{margin:24px max(24px,5vw)}
.bandw{background:#fff;color:#000;margin:60px max(16px,3.5vw) 0;border-radius:4px;padding:48px max(24px,4vw);display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.bandw h2{font-size:34px;font-weight:500;letter-spacing:-.025em;line-height:1.1}
.bandw p{max-width:340px;color:#444}
.foot{padding:48px max(24px,5vw) 30px;display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:24px;color:var(--mut);font-size:12.5px}
.foot h4{color:#fff;font-weight:500;margin-bottom:12px;font-size:12.5px}.foot a{display:block;margin-bottom:8px}
@media(max-width:800px){.foot{grid-template-columns:1fr 1fr}}
.copy{padding:0 max(24px,5vw) 40px;color:var(--dim);font-size:11.5px}

/* app */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#050608;padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto}
.side .logo{padding:4px 10px 18px}
.side a.nv{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--mut);font-size:13px;position:relative;transition:color .15s,background .15s}
.side a.nv svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side a.nv:hover{color:#fff;background:rgba(255,255,255,.04)}
.side a.nv.on{color:#fff;background:rgba(255,184,0,.12)}
.side a.nv.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ai)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(0,0,0,.8);backdrop-filter:blur(10px)}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.view{padding:22px 26px 60px;max-width:1500px;width:100%}
.menu{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:60;width:250px;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}
  .menu{display:inline-flex}
  .view{padding:16px 14px 60px}.top{padding:12px 14px}
}
.kpi{cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi small{color:var(--mut);font-size:12px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;display:flex;align-items:baseline;gap:6px}
.kpi .v span{font-size:13px;color:var(--mut);font-weight:400}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;border:1px solid var(--line2);cursor:pointer;background:transparent;color:var(--mut)}
.chip.on{background:rgba(255,184,0,.16);color:#fff;border-color:rgba(255,184,0,.5)}
.pill{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:500}
.pill.hi{background:rgba(255,93,93,.14);color:var(--bad)}.pill.md{background:rgba(245,165,36,.14);color:var(--warn)}.pill.lo{background:rgba(61,220,132,.13);color:var(--ok)}
.al{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:9px}
.al.hi{border-color:rgba(255,93,93,.35)}.al.md{border-color:rgba(245,165,36,.35)}
.al .ic{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn);box-shadow:0 0 0 0 rgba(245,165,36,.5)}
.al.hi .ic{background:var(--bad);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,93,.55)}70%{box-shadow:0 0 0 9px rgba(255,93,93,0)}100%{box-shadow:0 0 0 0 rgba(255,93,93,0)}}
.twin{position:relative;background:radial-gradient(ellipse at 50% 30%,#0d1220,#030405 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.twin canvas{display:block;width:100%;height:100%}
.info{position:absolute;right:12px;top:12px;width:250px;max-width:60%;background:rgba(10,11,15,.9);border:1px solid var(--line2);border-radius:10px;padding:14px;font-size:12.5px;backdrop-filter:blur(8px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto}
.dlg.wide{width:min(820px,100%)}
.step{display:flex;justify-content:space-between;padding:6px 0;color:var(--dim);font-size:13px;transition:color .2s}
.step.done{color:var(--tx)}.step.done b{color:var(--ok)}
.chat{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:13.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ai);color:#fff}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.sw input{accent-color:var(--ai)}
.note{font-size:11.5px;color:var(--dim)}
.hm td{padding:0}.hm .c{height:30px;min-width:38px;text-align:center;font-size:11px;line-height:30px;border:2px solid #0b0c0f;border-radius:5px;cursor:pointer}
.reduce *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;z-index:200;background:#fff;color:#000;padding:8px 12px;border-radius:6px}

</style>
<style>
/* ===== Leengate theme: orange background, black text, Bootstrap-based, 3D depth ===== */
:root{--orange:#FF6A00;--orange2:#FF8C32;
 --bg:#FF6A00;--panel:#ffffff;--panel2:#fff1e3;--line:rgba(0,0,0,.28);--line2:#000;--tx:#000;--mut:#000;--dim:#000;
 --bs-body-color:#000;--bs-body-bg:#FF6A00;--bs-link-color:#000;--bs-link-hover-color:#000;--bs-primary:#000;--bs-border-color:#000;
 --bs-font-sans-serif:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html{color-scheme:light;background:#FF6A00}
body{background:#FF6A00;color:#000;font-family:var(--font);font-size:14px;overflow-x:hidden}
body,body *:not(canvas){color:#000!important}
svg text{fill:#000!important}
::placeholder{color:rgba(0,0,0,.55)!important}
a{color:#000}
.mut,.note,.dim{opacity:.82}
.mono{font-family:var(--mono)}
/* surfaces */
.card{display:block;background:#fff;border:2px solid #000;border-radius:14px;box-shadow:6px 6px 0 #000;transition:transform .18s ease,box-shadow .18s ease;transform-style:preserve-3d;will-change:transform}
.card.tilt:hover,.kpi:hover{box-shadow:10px 12px 0 #000;border-color:#000}
.card h3{color:#000;font-weight:700;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase}
.btn{border:2px solid #000;background:#fff;border-radius:9px;font-weight:700;box-shadow:3px 3px 0 #000;transition:transform .12s,box-shadow .12s,background .12s;--bs-btn-hover-bg:#ffe3cc;--bs-btn-hover-border-color:#000}
.btn:hover{background:#ffe3cc;border-color:#000;transform:translate(-1px,-2px);box-shadow:5px 6px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.w,.btn-light{background:#fff;border-color:#000}
.btn.ai,.btn-lg-orange{background:#FF6A00;border-color:#000}
.btn.ai:hover,.btn-lg-orange:hover{background:#ff8c32}
.btn-dark,.text-bg-dark,.bg-dark{background:#fff!important;border:2px solid #000!important}
.btn-dark:hover{background:#ffe3cc!important}
.btn.hard{box-shadow:5px 5px 0 #000}
.btn:disabled{opacity:.6}
.pro-badge{display:inline-block;padding:3px 10px;border-radius:99px;border:2px solid #000;font-weight:800;font-size:11px;background:#fff}
.pro-badge.b-dark{background:#fff}.pro-badge.b-amber{background:#FFD60A}.pro-badge.b-red{background:#ff6b5c}
.tag{border:1.5px solid #000;background:#fff;font-weight:600}
.tag.sim,.tag.obs,.tag.pred,.tag.tgt{border-color:#000}
.tag.sim{background:#FFD60A}.tag.obs{background:#b6f2c8}.tag.pred{background:#ffe0b5}.tag.tgt{background:#bff0ea}
.pill{border:1.5px solid #000}.pill.hi{background:#ff9d92}.pill.md{background:#ffe27a}.pill.lo{background:#b6f2c8}
.chip{border:1.5px solid #000;background:#fff}.chip.on{background:#FF6A00}
.alert{} .al{display:flex;gap:12px;padding:12px;border:2px solid #000;border-radius:10px;background:#fff7ef;margin-bottom:9px}
.al .ic{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn);border:1.5px solid #000}.al.hi .ic{background:var(--bad);animation:pulse 2s infinite}
.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{background:rgba(0,0,0,.14);border:1.5px solid #000;border-radius:9px}.progress-bar{background:#000}
.bar{background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.5);height:7px}
table{color:#000}th{background:rgba(255,106,0,.22);border-bottom:2px solid #000;color:#000;font-weight:700}
td{border-bottom:1px solid rgba(0,0,0,.22)}
select,input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],textarea{background:#fff;border:2px solid #000;color:#000;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;width:100%}
input[type=range]{accent-color:#000}label{color:#000;font-weight:600}
.hm .c{border:2px solid #fff}
.legend,.sw,.kpi small,.kpi .v span{color:#000}
.legend i{border:1px solid #000}
.msg.u{background:#FF6A00;border:2px solid #000}.msg.a{background:#fff;border:2px solid #000}
.twin{background:radial-gradient(ellipse at 50% 30%,#262320,#0c0b0a 72%);border:2px solid #000;box-shadow:6px 6px 0 #000}
.info{background:#fff;border:2px solid #000}
.dlg{background:#fff;border:3px solid #000;border-radius:16px;padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:10px 10px 0 #000}.dlg.wide{width:min(820px,100%)}
.overlay{background:rgba(0,0,0,.55)}
.step.done b{color:#000}
.skip:focus{background:#fff}
/* app shell */
.side{background:#fff;border-right:3px solid #000}
.side a.nv{color:#000;font-weight:600}.side a.nv:hover{background:rgba(255,106,0,.18)}
.side a.nv.on{background:#FF6A00;border:2px solid #000;box-shadow:3px 3px 0 #000}.side a.nv.on::before{display:none}
body[class^="role-"] #side{background:#fff;border-right:3px solid #000}
body[class^="role-"] #side .nv.on{background:#FF6A00;color:#000}
body[class^="role-"] #roleTag{border-color:#000;background:#fff}
body[class^="role-"] .top,.top{background:rgba(255,255,255,.96);border-bottom:3px solid #000}
.view{background:transparent}
.kpi .v{font-weight:800}
/* landing */
.lg-nav{background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:3px solid #000;z-index:40}
.lg-nav .nav-link{font-weight:700;letter-spacing:.03em;padding:.5rem .8rem}.lg-nav .nav-link:hover{background:rgba(255,106,0,.25);border-radius:8px}
.navbar-toggler{border:2px solid #000}
.hero-hud{position:relative;min-height:max(calc(100vh - 62px),780px);overflow:hidden;background:radial-gradient(ellipse 62% 58% at 64% 52%,#ff9a45 0%,#FF6A00 56%,#e55a00 100%)}
.hero-hud::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.22) 1px,transparent 0);background-size:30px 30px;opacity:.55;z-index:0}
#scene{position:absolute;inset:0;z-index:1;display:block}
.hud{position:absolute;z-index:3;font-size:10.5px;letter-spacing:.05em;line-height:1.55;text-transform:uppercase}
.hud hr{margin:6px 0;border-top:1px solid #000;opacity:.7}
.hud a{text-decoration:none;font-weight:700}
.hud-tl{top:16px;left:max(16px,3vw);width:min(330px,60vw)}.hud-tr{top:16px;right:max(16px,3vw);width:min(420px,40vw)}
.hud-left{top:92px;left:max(16px,3vw);width:250px}.hud-v{width:1px;height:46px;background:#000;margin:10px 0 10px 8px}.hud-ev{font-size:10px;max-width:240px;text-transform:uppercase}
.hud-sub{opacity:.75}.hud-right{top:82px;right:max(16px,3vw);width:300px}
.hud-bl{left:max(16px,3vw);right:max(16px,3vw);bottom:18px}.hud-br{right:max(16px,3vw);top:58px}
.odo{font-size:26px;font-weight:500;letter-spacing:.03em;line-height:1.15}
.hud-spark{min-width:220px;border:1px solid #000;background:rgba(255,255,255,.35);padding:2px}
.hero-copy{position:relative;z-index:4;padding-top:clamp(150px,26vh,260px);padding-bottom:140px}
@media(min-width:1200px){.hero-copy{padding-top:clamp(240px,34vh,330px)}}
.hero-copy h1{font-size:clamp(2.1rem,3.6vw,3.5rem);letter-spacing:-.03em}
.hero-copy .u{background:#fff;padding:0 .18em;box-shadow:5px 5px 0 #000;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero-copy .lead{font-size:1rem;font-weight:500;max-width:430px}
.typer{font-size:11.5px;letter-spacing:.1em;min-height:20px}
.step-no{width:44px;height:44px;border:2px solid #000;border-radius:12px;display:grid;place-items:center;font-weight:800;background:#FF6A00;box-shadow:3px 3px 0 #000}
section[id]{scroll-margin-top:70px}
.lg-foot{background:#fff;border-top:3px solid #000}
.modal-content{border:3px solid #000;border-radius:18px;box-shadow:10px 10px 0 #000;background:#fff}
.modal-header,.modal-footer{border:0}.btn-close{filter:none;opacity:1}
.form-control{border:2px solid #000;border-radius:9px;font-weight:600;color:#000;padding:.6rem .8rem}
.form-control:focus{border-color:#000;box-shadow:4px 4px 0 #FF6A00}
@media(max-width:991.98px){.hero-copy{padding-top:60px;padding-bottom:calc(60vh + 120px)}.hero-hud{min-height:max(100vh,900px)}.hud-bl{bottom:8px}}
@media(max-width:575.98px){.odo{font-size:20px}.hud-spark{min-width:120px;flex-basis:100%}}

</style>

  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="top">
      <div class="rw"><button class="btn sm menu" id="menuBtn" aria-label="Open menu">Menu</button><h1 id="ttl"></h1></div>

function boosted(y){const n=y.length,T=[...y.keys()],mt=mean(T),my=mean(y);let sxy=0,sxx=0;T.forEach((t,i)=>{sxy+=(t-mt)*(y[i]-my);sxx+=(t-mt)**2});const sl=sxy/sxx,ic=my-sl*mt,base=t=>ic+sl*t,res=y.map((v,i)=>v-base(i)),stumps=[],F=t=>[t%12,t],lr=.15;

function countUp(root=document){$$('[data-count]',root).forEach(el=>{const to=parseFloat(el.dataset.count),d=+(el.dataset.d||0),suf=el.dataset.suf||'';if(!anim()){el.textContent=to.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+suf;return}const t0=performance.now();const tick=t=>{const p=clamp((t-t0)/900,0,1),e=1-Math.pow(1-p,3);el.textContent=(to*e).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+suf;if(p<1&&el.isConnected)requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
/* AI processing overlay */
function processing(title,steps,done){const ov=$('#ov'),b=$('#ovb');b.className='modal';b.innerHTML=`<h3 style="font-size:15px;margin-bottom:4px">${title}</h3><p class="note" style="margin-bottom:14px">AI engine processing</p>${steps.map((s,i)=>`<div class="step" id="st${i}"><span>${s}</span><b></b></div>`).join('')}<div id="stdone" class="mut" style="margin-top:12px;font-size:13px"></div>`;ov.classList.add('show');let i=0;const gap=anim()?380:0;const next=()=>{if(i<steps.length){const e=$('#st'+i);e.classList.add('done');e.lastChild.textContent='✓';i++;gap?setTimeout(next,gap):next()}else{$('#stdone').innerHTML='<span class="ok">Analysis complete</span>';setTimeout(()=>{ov.classList.remove('show');done&&done()},gap?650:0)}};gap?setTimeout(next,gap):next()}
function modal(html,wide){const ov=$('#ov'),b=$('#ovb');b.className='modal'+(wide?' wide':'');b.innerHTML=html;ov.classList.add('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')e.target.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('show')});
async function saveFile(filename,data){try{const d=await claude.use('downloads');if(d){await d.save({filename,data});return}}catch(e){if(e&&e.code==='declined')return}
 modal(`<h3 style="font-size:15px;margin-bottom:10px">${filename}</h3><p class="note" style="margin-bottom:10px">Downloads are not available in this view. Copy the contents below instead.</p><textarea rows="12" id="cp" style="font-family:var(--mono);font-size:11.5px">${String(data).replace(/</g,'&lt;')}</textarea><div class="rw" style="margin-top:12px"><button class="btn sm" onclick="$('#cp').select();try{document.execCommand('copy')}catch(e){}">Copy</button><button class="btn sm" onclick="$('#ov').classList.remove('show')">Close</button></div>`,true)}
const toCSV=(head,rows)=>[head,...rows].map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');

const S={mat:'cement',hor:12,twin:null};
const AUDIT=[];function audit(t){const d=new Date();AUDIT.unshift({t,by:USER?USER.name+' ('+roleLabel(ROLE)+')':'System',at:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})})}
audit('Dataset loaded — built-in synthetic supply-chain history (36 months)');audit('Demand models trained — 5 models, 6 materials');audit('Bottleneck detection run');
const prov=()=>DATASET.source==='real'?['obs','Observed']:['sim','Simulated'];
const provTag=()=>{const p=prov();return`<span class="tag ${p[0]}">${p[1]}</span>`};
const MAT=id=>MATERIALS.find(m=>m.id===id);
function detect(){return BCATS.map(c=>{const rec=mean(c.counts.slice(-3)),pri=mean(c.counts.slice(0,-3)),s=sd(c.counts.slice(0,-3))||1;return{c,chg:(rec/pri-1)*100,z:(rec-pri)/s,rec}}).sort((a,b)=>b.z-a.z)}
function recs(){const out=[];INV.filter(i=>i.status==='critical'||i.status==='low').sort((a,b)=>b.pOut-a.pOut).slice(0,3).forEach(i=>{const add=Math.max(i.rop+i.ss-i.stock,0),sl=i.sdm/Math.sqrt(30)*Math.sqrt(i.m.lead)+1e-9,after=(1-cdf((i.stock+add-i.fc/30*i.m.lead)/sl))*100;out.push({t:'Reorder '+i.m.name.toLowerCase(),tone:i.status==='critical'?'hi':'md',mat:i.m.name,body:`Stock is ${fmt(i.stock)} ${i.m.unit} against a reorder point of ${fmt(i.rop)}. Order about ${fmt(add)} ${i.m.unit} now.`,ben:`Stock-out risk falls from ${f1(i.pOut)}% to ${f1(after)}%`})});
 const B=SUPPLIERS[1];out.push({t:'Rebalance supplier allocation',tone:'hi',mat:'Steel rebar',body:`${B.name} has ${B.ontime}% on-time delivery and a ${B.lead} day average lead time. Move about 15% of steel volume to a second supplier.`,ben:'Lead-time variance down about 12%'});
 const r4=ROUTES[3],r2=ROUTES[1],e4=r4.days*(1+r4.delay),e2=r2.days*(1+r2.delay);out.push({t:'Use Route 2 as the alternate corridor',tone:'md',mat:'Logistics',body:`Route 4 has a ${Math.round(r4.delay*100)}% delay rate. Route 2 has ${Math.round(r2.delay*100)}%.`,ben:`Expected transit ${f1(e4)} → ${f1(e2)} days on the affected leg`});
 const rc=REC.filter(r=>!r.done&&new Set(r.v).size>1).length;if(rc)out.push({t:'Reconcile record mismatches',tone:'md',mat:'Data',body:`${rc} materials have quantities that differ between procurement, supplier, warehouse, production or transport records.`,ben:'One consistent quantity per material'});
 const f=forecast(S.mat,12),pk=f.ft.indexOf(Math.max(...f.ft));out.push({t:'Prepare for the seasonal peak',tone:'lo',mat:MAT(S.mat).name,body:`Forecast demand for ${MAT(S.mat).name.toLowerCase()} peaks in ${MN[(36+pk)%12]} at about ${fmt(f.ft[pk])} ${MAT(S.mat).unit}.`,ben:'Book supplier capacity ahead of the peak'});return out}
const kpiCard=(k)=>`<div class="card kpi" data-go="${k.go}" tabindex="0" role="link" title="Open ${k.go}"><div class="rw sp"><small>${k.l}</small>${k.tag||provTag()}</div><div class="v"><b data-count="${k.v}" data-d="${k.d||0}" data-suf="${k.suf||''}">0</b><span>${k.u||''}</span></div><div class="${k.c||'ok'}" style="font-size:12px;margin-bottom:6px">${k.tr||''}</div>${spark(k.sp,k.col||'#3ddc84')}</div>`;

const PAGES={};
PAGES.command={t:'Command Centre',render(){const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',red=REDUCTION,
 stockA=INV.filter(i=>i.status==='critical'||i.status==='low').sort((a,b)=>a.stock-b.stock).map(i=>({sev:i.status==='critical'?'hi':'md',t:i.m.name+' running low',d:`${fmt(i.stock)} ${i.m.unit} in stock · reorder point ${fmt(i.rop)}`})),
 routeA=ROUTES.filter(r=>r.delay>.15).sort((a,b)=>b.delay-a.delay).map(r=>({sev:r.delay>.25?'hi':'md',t:r.name.split(' · ')[1]+' — delay risk',d:`${Math.round(r.delay*100)}% historical delay rate · ${r.days} day transit`})),
 al=[...stockA,...routeA].slice(0,4),topRisk=SUPPLIERS.slice().sort((a,b)=>b.risk-a.risk)[0];
 return`<div class="rw sp" style="margin-bottom:16px"><div><h2 style="font-size:22px;font-weight:600;letter-spacing:-.02em">${g} — supply chain intelligence</h2><p class="mut">Leengate Construction & Plant Hire · 36 months of history · 6 materials · ${SUPPLIERS.length} suppliers</p></div><div class="rw"><button class="btn ai sm" data-act="optimise">Run AI optimisation</button></div></div>

function forecastBlock(){const m=MAT(S.mat),F=forecast(S.mat,S.hor),y=m.series,lab=[...MONTHS.map(t=>t.label),...Array.from({length:S.hor},(_,i)=>MN[i%12]+' 26')];
 const hold=y.length-HOLD;const tot=sum(F.ft),last12=sum(y.slice(-12)),chg=(mean(F.ft.slice(0,12))/mean(y.slice(-12))-1)*100,inv=INV.find(i=>i.m.id===m.id),conf=clamp(F.model.acc-2,0,99);
 const chart=lineChart({labels:lab,h:300,series:[{name:'Actual',v:[...y,...Array(S.hor).fill(null)],c:'#ffb800',w:2},{name:'Predicted (holdout)',v:[...Array(hold).fill(null),...F.fitted,...Array(S.hor).fill(null)],c:'#f5a524',dash:'5 3'},{name:'Forecast',v:[...Array(35).fill(null),y[35],...F.ft],c:'#5eead4',w:2}],band:{lo:[...Array(36).fill(null),...F.ft.map((v,i)=>Math.max(0,v-F.band[i]))],hi:[...Array(36).fill(null),...F.ft.map((v,i)=>v+F.band[i])]},split:36});
 return{chart,html:`<div class="grid g4" style="margin-bottom:14px"><div class="card"><small class="mut">Expected demand · next ${S.hor} months</small><div class="big">${fmt(tot)}</div><span class="mut">${m.unit}</span></div><div class="card"><small class="mut">Model confidence</small><div class="big">${f1(conf)}%</div><span class="mut">${F.model.name}</span></div><div class="card"><small class="mut">Forecast trend</small><div class="big ${chg>=0?'warn':'ok'}" style="font-size:26px">${chg>=1?'Increasing':chg<=-1?'Decreasing':'Stable'}</div><span class="mut">${chg>=0?'+':''}${f1(chg)}% vs last 12 months</span></div><div class="card"><small class="mut">Recommended reorder point</small><div class="big">${fmt(inv.rop)}</div><span class="mut">${m.unit} · safety stock ${fmt(inv.ss)}</span></div></div><div class="card"><h3>Actual vs predicted, with forecast ${provTag()}</h3>${chart}<div class="legend" style="margin-top:8px"><span><i style="background:#ffb800"></i>Actual</span><span><i style="background:#f5a524"></i>Predicted on held-out months</span><span><i style="background:#5eead4"></i>Forecast and confidence interval</span></div></div>`,F}}
PAGES.forecast={t:'Demand Forecasting',render(){const fb=forecastBlock(),m=MAT(S.mat),y=m.series,f=fb.F,w=olsFit(y).w,n=36,x=feats(n+5),trendPart=w[0]+w[1]*(n+5),seas=x.slice(2).reduce((s,v,i)=>s+v*w[i+2],0),ly=y[29];
 const ex=[['Underlying trend',(trendPart/mean(y)-1)*100],['Seasonal effect',seas/mean(y)*100],['Same month last year',(ly/mean(y)-1)*100],['Latest 3-month movement',(mean(y.slice(-3))/mean(y.slice(-6,-3))-1)*100]];

 <div class="card"><h3>AI material demand predictor</h3><div class="grid g2" style="gap:10px"><div><label>Previous month demand: <b id="lpm"></b></label><input type="range" id="ipm" min="50" max="150" value="100"></div><div><label>Same month last year: <b id="lpy"></b></label><input type="range" id="ipy" min="50" max="150" value="100"></div><div><label>Production requirement: <b id="lpr"></b></label><input type="range" id="ipr" min="70" max="140" value="100"></div><div><label>Current inventory: <b id="lci"></b></label><input type="range" id="ici" min="0" max="250" value="100"></div><div><label>Supplier lead time: <b id="lld"></b> days</label><input type="range" id="ild" min="1" max="30" value="${m.lead}"></div><div><label>Supplier reliability: <b id="lrl"></b>%</label><input type="range" id="irl" min="50" max="100" value="${SUPPLIERS.find(s=>s.id===m.supplier).rel}"></div></div><div style="margin:8px 0"><label for="isn">Season</label><select id="isn"><option value="1.06">Dry season (Apr–Oct)</option><option value="0.93">Rainy season (Nov–Mar)</option><option value="1">Transition</option></select></div><p class="note">Sliders are shown as % of the usual level for ${m.name.toLowerCase()}.</p></div></div>

  const m=MAT(S.mat),y=m.series,avg=mean(y.slice(-12)),pmB=y[35],pyB=y[23],inv=INV.find(i=>i.m.id===m.id);const calc=()=>{const v=id=>+$('#'+id).value,pm=pmB*v('ipm')/100,py=pyB*v('ipy')/100,prod=avg*v('ipr')/100,sf=+$('#isn').value,ci=inv.rop*v('ici')/100,lead=v('ild'),rel=v('irl');

 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Pareto — events by category</h3>${pareto}</div><div class="card"><h3>Events per month, by year</h3>${lineChart({labels:MN,h:250,series:[0,1,2].map(y=>({name:String(2023+y),v:BTOT.slice(y*12,y*12+12),c:['#ffb800','#f5a524','#3ddc84'][y]})),fmtY:v=>Math.round(v)})}<div class="legend"><span><i style="background:#ffb800"></i>2023</span><span><i style="background:#f5a524"></i>2024</span><span><i style="background:#3ddc84"></i>2025</span></div></div></div>

 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Bottleneck detection engine</h3>${dets.map(d=>`<div class="al ${d.z>1.5?'hi':'md'}"><div class="ic"></div><div><b style="font-size:13px">${d.c.name}</b><div class="mut" style="font-size:12.5px">Last 3 months: ${d.chg>=0?'+':''}${Math.round(d.chg)}% versus earlier · risk ${d.z>1.5?'HIGH':d.z>.5?'MEDIUM':'LOW'}<br>Estimated impact ${d.c.days} days per event.</div><div class="ok" style="font-size:12px;margin-top:4px">${d.c.id==='supplier'?'Increase safety stock by about 8% or move 20% of volume to another supplier.':d.c.id==='transport'?'Use the alternate corridor during the rainy season.':d.c.id==='inventory'?'Raise reorder points ahead of the seasonal peak.':'Review the process and set a delivery-time target.'}</div></div></div>`).join('')}</div>
 <div class="card"><h3>Supplier and route ranking</h3>${barsH(SUPPLIERS.slice().sort((a,b)=>b.risk-a.risk).map(s=>({n:s.name+' — risk',v:s.risk,c:s.risk>60?'#ff5722':s.risk>40?'#f5a524':'#3ddc84'})),{max:100})}<div style="height:6px"></div>${barsH(ROUTES.slice().sort((a,b)=>b.delay-a.delay).map(r=>({n:r.name,v:r.delay*100,sfx:'% delayed',c:r.delay>.3?'#ff5722':r.delay>.15?'#f5a524':'#3ddc84'})),{max:40,fmtV:v=>Math.round(v)})}</div></div>`},
 init(){$$('[data-hm]').forEach(c=>c.onclick=()=>{const[a,b,v]=c.dataset.hm.split('|');$('#hmi').innerHTML=`<b>${a}</b> in ${b}: <span class="mono">${v}</span> events across 2023–2025.`})}};

PAGES.inventory={t:'Inventory Optimisation',render(){const ct={critical:0,low:0,optimal:0,excess:0};INV.forEach(i=>ct[i.status]++);
 return`<div class="grid g4" style="margin-bottom:14px">${[['critical','Critical stock'],['low','Low stock'],['optimal','Optimal stock'],['excess','Excess stock']].map(([k,l])=>`<div class="card" style="border-color:${STATUSCOL[k]}55"><small class="mut"><i class="dot" style="background:${STATUSCOL[k]}"></i>${l}</small><div class="big">${ct[k]}</div><span class="mut">materials</span></div>`).join('')}</div>
 <div class="card"><h3>Smart inventory optimiser ${provTag()}</h3><div class="tblwrap"><table><tr><th>Material</th><th>Current</th><th>Safety stock</th><th>Reorder point</th><th>EOQ</th><th>Next-month forecast</th><th>Stock-out</th><th>Overstock</th><th>Status</th></tr>${INV.map(i=>`<tr><td><b>${i.m.name}</b><div class="note">${i.m.unit}</div></td><td class="mono">${fmt(i.stock)}</td><td class="mono">${fmt(i.ss)}</td><td class="mono">${fmt(i.rop)}</td><td class="mono">${fmt(i.eoq)}</td><td class="mono">${fmt(i.fc)}</td><td class="mono">${f1(i.pOut)}%</td><td class="mono">${f1(i.pOver)}%</td><td><span class="pill" style="background:${STATUSCOL[i.status]}22;color:${STATUSCOL[i.status]}">${{critical:'Critical',low:'Low',optimal:'Optimal',excess:'Excess'}[i.status]}</span></td></tr>`).join('')}</table></div></div>
 <div class="card" style="margin-top:14px"><h3>Warehouse shelves</h3><div class="grid g3">${INV.map(i=>{const cap=Math.max(i.stock,i.rop*2.4),lv=i.stock/cap,rp=i.rop/cap,sp=i.ss/cap;return`<div><div class="rw sp" style="font-size:12.5px;margin-bottom:6px"><b>${i.m.name}</b><span style="color:${STATUSCOL[i.status]}">${i.status}</span></div><svg viewBox="0 0 220 84" width="100%" role="img" aria-label="${i.m.name} shelf"><rect x="1" y="6" width="218" height="60" rx="6" fill="#101116" stroke="rgba(255,255,255,.1)"/>${Array.from({length:12},(_,k)=>{const f=(k+1)/12<=lv;return`<rect x="${8+k*17.5}" y="${f?16:44}" width="14" height="${f?42:14}" rx="2" fill="${f?STATUSCOL[i.status]:'rgba(255,255,255,.05)'}" opacity="${f?.85:1}"/>`}).join('')}<line x1="${8+rp*210}" x2="${8+rp*210}" y1="4" y2="72" stroke="#fff" stroke-dasharray="3 2"/><text x="${8+rp*210}" y="82" fill="#8b90a0" font-size="8" text-anchor="middle">reorder point</text><line x1="${8+sp*210}" x2="${8+sp*210}" y1="4" y2="72" stroke="#ff5722" stroke-dasharray="2 2"/></svg></div>`}).join('')}</div><div class="legend"><span><i style="background:#ff5722"></i>Critical</span><span><i style="background:#f5a524"></i>Low</span><span><i style="background:#3ddc84"></i>Optimal</span><span><i style="background:#ffb800"></i>Excess</span></div></div>`}};

PAGES.suppliers={t:'Supplier Intelligence',render(){const mine=ROLE==='supplier'&&USER&&USER.company;const rk=SUPPLIERS.slice().sort((a,b)=>b.score-a.score);const list=mine?SUPPLIERS.filter(s=>s.id===USER.company):rk;return`${mine?`<div class="card"><h3>Your supplier account</h3><p class="note" style="margin-bottom:0">You're signed in as <b>${USER.name}</b> from <b>${SUPPLIERS.find(s=>s.id===USER.company).name}</b>. This view shows only your own company's performance, capacity and delivery data — not other suppliers'.</p></div>`:`<div class="card"><h3>Supplier ranking ${provTag()}</h3>${barsH(rk.map((s,i)=>({n:(i+1)+'. '+s.name,v:s.score,c:s.risk>60?'#ff5722':s.risk>40?'#f5a524':'#3ddc84'})),{max:100})}</div>`}<div class="grid g3" style="margin-top:14px">${list.map(s=>{const lvl=s.risk>60?'High':s.risk>40?'Medium':'Low';const hist=MONTHS.slice(-12).map((_,i)=>s.ontime+Math.sin(i+s.risk)*4-(s.risk>60?i*.3:0));const avail=Math.round(s.cap*(.35+(100-s.risk)/100*.55));return`<div class="card"><div class="rw sp"><b style="font-size:15px">${s.name}</b>${pill(lvl)}</div><div class="mut" style="font-size:12px;margin:2px 0 10px">${s.mat.join(', ')} · ${s.city}</div><div class="grid g2" style="gap:8px;font-size:12.5px"><div><small class="mut">Reliability</small><div class="mono">${s.rel}%</div></div><div><small class="mut">On-time</small><div class="mono">${s.ontime}%</div></div><div><small class="mut">Lead time</small><div class="mono">${s.lead} days</div></div><div><small class="mut">Defect rate</small><div class="mono">${s.defect}%</div></div><div><small class="mut">Cost index</small><div class="mono">${s.cost}</div></div><div><small class="mut">Risk score</small><div class="mono">${s.risk}/100</div></div></div><div class="rw sp" style="margin-top:10px;font-size:12.5px"><span class="mut"><span class="dot"></span>Live capacity available</span><b class="mono" id="cap-${s.id}" data-v="${avail}">${fmt(avail)} ${s.capu}</b></div><div style="margin:10px 0 4px">${spark(hist,s.risk>60?'#ff5722':'#ffb800')}</div><div class="note">On-time delivery, last 12 months</div><div class="al ${s.risk>60?'hi':s.risk>40?'md':''}" style="margin:10px 0 0"><div class="ic" style="${s.risk<=40?'background:#3ddc84':''}"></div><div style="font-size:12.5px"><b>AI recommendation</b><br>${s.rec}</div></div></div>`}).join('')}</div><p class="note" style="margin-top:10px">Supplier names are real Zimbabwean construction-material businesses, used here for realism in this academic study. Reliability, risk, defect and capacity figures are simulated example data for the study — not a real performance assessment of these companies. "Live capacity available" refreshes automatically to illustrate a live feed; it is not connected to a real supplier system.</p>`},
 init(){const tick=()=>{if(!$('#cap-A')&&!(USER&&$('#cap-'+USER.company)))return;SUPPLIERS.forEach(s=>{const el=$('#cap-'+s.id);if(!el)return;const cur=+el.dataset.v,nv=clamp(cur+(Math.random()-.5)*s.cap*.08,s.cap*.15,s.cap*.95);el.dataset.v=nv;el.textContent=fmt(nv)+' '+s.capu});setTimeout(tick,anim()?3500:1e9)};tick()}};

function applyDataset(clean){const acc={};clean.forEach(r=>{if(!r.date||!r.qty)return;const mi=(+r.date.slice(0,4)-2023)*12+(+r.date.slice(5,7)-1);if(mi<0||mi>35)return;const m=MATERIALS.find(x=>x.name===r.material);if(!m)return;(acc[m.id]=acc[m.id]||Array(36).fill(0))[mi]+=r.qty});let n=0;
 MATERIALS.forEach(m=>{const a=acc[m.id];if(!a||a.filter(v=>v>0).length<30)return;for(let i=0;i<36;i++)if(a[i]===0){let l=i-1,r=i+1;while(l>=0&&a[l]===0)l--;while(r<36&&a[r]===0)r++;a[i]=l>=0&&r<36?(a[l]+a[r])/2:a[l>=0?l:r]}m.series=a.map(Math.round);n++});
 if(n){MATERIALS.forEach(m=>EVAL[m.id]=evaluate(m.series));INV=buildInv();KPI=buildKpi()}return n}
const ARCH=[['Data sources','Procurement, supplier, inventory, transport and production records.'],['Data intelligence layer','Cleaning, validation, reconciliation and feature engineering. Runs in the Data Intelligence page.'],['AI / ML engine','Demand forecasting, bottleneck detection, risk prediction and route optimisation.'],['Decision engine','Recommendations for inventory, supplier and logistics decisions.'],['Business outcomes','Lower lead time, fewer stock-outs, better forecasts, better data quality, lower logistics risk.']];

PAGES.data={t:'Data Intelligence',render(){const c=CLEAN,b=c.before,a=c.after;const bad=DATASET.rows.filter(r=>r.qty==null||r.qty<=0||!parseDate(r.date)||!CANON.sup.includes(r.supplier)||!CANON.mat.includes(r.material)).slice(0,6);
 return`<div class="card"><h3>Dataset <span class="tag ${DATASET.source==='real'?'obs':'sim'}">${DATASET.source==='real'?'Observed — uploaded':'Simulated — built-in'}</span></h3><div class="rw sp"><div><b>${DATASET.name}</b><div class="mut" style="font-size:12.5px">${fmt(c.total)} records · columns: id, supplier, material, quantity, date</div></div><div class="rw"><label class="btn sm" for="up" style="margin:0;cursor:pointer">Upload CSV</label><input type="file" id="up" accept=".csv,text/csv" hidden><button class="btn ai sm" id="clean">Run AI cleaning</button></div></div><p class="note" id="upmsg" style="margin-top:8px">Upload a CSV with supplier, material, quantity and date columns. Dates from 2023 to 2025 update the demand history and every forecast.</p></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Before cleaning</h3><div class="big">${fmt(c.total)} <span class="mut" style="font-size:14px">records</span></div><div class="bad" style="font-size:20px;margin:8px 0">${fmt(b.problem)} problem records · ${f1(b.problem/c.total*100)}%</div>${barsH([['Missing quantities',b.missing],['Duplicate records',b.dupes],['Invalid or mixed-format dates',b.badDate],['Zero or negative quantities',b.badQty],['Outliers',b.outliers],['Inconsistent supplier names',b.namesS],['Inconsistent material names',b.namesM]].map(([n,v])=>({n,v,c:'#ff5722'})),{max:Math.max(b.missing,b.dupes,b.badDate,b.namesS,b.namesM,b.outliers,1)})}</div>
 <div class="card"><h3>After AI cleaning</h3><div class="big">${fmt(a.total)} <span class="mut" style="font-size:14px">records</span></div><div class="ok" style="font-size:20px;margin:8px 0">${fmt(c.unresolved)} unresolved · ${f1(c.quality)}% data quality</div><div class="mut" style="font-size:12.5px">${[['Duplicates removed',c.log.dedup],['Names standardised',c.log.names],['Dates standardised',c.log.dates],['Missing quantities filled (material median)',c.log.imputed],['Sign errors corrected',c.log.qtyFixed],['Outliers capped',c.log.capped]].map(([n,v])=>`<div class="rw sp" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${n}</span><span class="mono">${fmt(v)}</span></div>`).join('')}</div><p class="note" style="margin-top:8px">Unresolved records have dates or names that cannot be repaired automatically and need a source check.</p></div></div>
 ${bad.length?`<div class="card" style="margin-top:14px"><h3>Examples of records that needed cleaning</h3><div class="tblwrap"><table><tr><th>ID</th><th>Supplier</th><th>Material</th><th>Quantity</th><th>Date</th></tr>${bad.map(r=>`<tr><td class="mono">${r.id}</td><td>${r.supplier}</td><td>${r.material}</td><td class="mono">${r.qty??'<span class="bad">missing</span>'}</td><td class="mono">${r.date}</td></tr>`).join('')}</table></div></div>`:''}
 <div class="card" style="margin-top:14px"><h3>Data reconciliation engine <button class="btn ai sm" id="rec">AI reconcile</button></h3><div class="tblwrap"><table><tr><th>Material</th>${SRC.map(s=>`<th>${s}</th>`).join('')}<th>Status</th></tr>${REC.map(r=>{const c=consensus(r.v),bad=r.v.some(x=>x!==c);return`<tr><td>${r.m.name}</td>${r.v.map(x=>`<td class="mono ${x!==c&&!r.done?'warn':''}">${fmt(r.done?c:x)}</td>`).join('')}<td>${r.done?'<span class="pill lo">Reconciled</span>':bad?'<span class="pill md">Mismatch</span>':'<span class="pill lo">Match</span>'}</td></tr>`}).join('')}</table></div><div class="mut" style="font-size:12.5px;margin-top:10px" id="recmsg">${REC.every(r=>r.done||new Set(r.v).size===1)?'Records reconciled successfully.':(()=>{const r=REC.find(r=>!r.done&&new Set(r.v).size>1),c=consensus(r.v),o=r.v.findIndex(x=>x!==c);return`AI explanation: ${SRC[o]} records for ${r.m.name.toLowerCase()} differ from the other sources by ${fmt(Math.abs(r.v[o]-c))} ${r.m.unit}. The agreed value is ${fmt(c)}.`})()}</div></div>
 <div class="card" style="margin-top:14px"><h3>Add a record</h3><p class="note" style="margin-bottom:10px">Capture a single procurement, delivery or usage record by hand — useful when a site engineer has no CSV to upload.</p><div class="grid g4" style="gap:10px"><div><label for="nsup">Supplier</label><select id="nsup">${CANON.sup.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label for="nmat">Material</label><select id="nmat">${CANON.mat.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label for="nqty">Quantity</label><input type="text" id="nqty" placeholder="e.g. 500"></div><div><label for="ndate">Date</label><input type="text" id="ndate" placeholder="YYYY-MM-DD"></div></div><button class="btn ai sm" id="nadd" style="margin-top:10px">Add record</button><p class="note" id="nmsg" style="margin-top:8px">New records are cleaned and reconciled immediately, and count toward the totals above.</p></div>
 <div class="card" style="margin-top:14px"><h3>Manage records <span class="tag">${MANUAL.length} added this session</span></h3><div class="tblwrap"><table id="mtab"><tr><th>ID</th><th>Supplier</th><th>Material</th><th>Quantity</th><th>Date</th><th></th></tr>${MANUAL.length?MANUAL.map((r,i)=>`<tr><td class="mono">${r.id}</td><td>${r.supplier}</td><td>${r.material}</td><td class="mono">${fmt(r.qty)}</td><td class="mono">${r.date}</td><td><button class="btn sm" data-del="${i}">Delete</button></td></tr>`).join(''):'<tr><td colspan="6" class="mut">No manual records yet — add one above.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:14px"><h3>Data lineage</h3><div class="rw" style="gap:6px">${['Raw data','Cleaned data','Features','ML model','Prediction','Decision'].map((s,i,a)=>`<span class="chip on">${s}</span>${i<a.length-1?'<span class="mut">→</span>':''}`).join('')}</div></div>`},
 init(){$('#clean').onclick=()=>processing('AI data cleaning',['Loading records','Detecting missing values and duplicates','Standardising names and dates','Correcting quantities','Validating results'],()=>{runClean();audit('Dataset cleaned: '+fmt(CLEAN.total)+' records');go('data')});
  $('#rec').onclick=()=>processing('Reconciling records',['Comparing five data sources','Finding quantity differences','Choosing the agreed value','Updating records'],()=>{REC.forEach(r=>r.done=true);audit('Records reconciled across 5 sources');go('data')});
  $('#nadd').onclick=async()=>{const sup=$('#nsup').value,mat=$('#nmat').value,qty=+$('#nqty').value,dateIn=$('#ndate').value.trim();
   if(!qty||qty<=0){$('#nmsg').innerHTML='<span class="bad">Enter a quantity greater than zero.</span>';return}
   const date=dateIn||new Date().toISOString().slice(0,10);if(!parseDate(date)){$('#nmsg').innerHTML='<span class="bad">Use date format YYYY-MM-DD.</span>';return}
   try{await apiPost('/records',{supplier:sup,material:mat,quantity:qty,date});DATASET.rows.push({id:'MR-'+(1000+MANUAL.length),supplier:sup,material:mat,qty,date});runClean();const d=await apiGet('/records');mergeRecords(d.records);go('data')}
   catch(err){$('#nmsg').innerHTML='<span class="bad">'+err.message+'</span>'}};
  $$('[data-del]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.del,rec=MANUAL[i];if(!rec)return;try{await apiDelete('/records/'+rec.id);const d=await apiGet('/records');mergeRecords(d.records);go('data')}catch(err){alert(err.message)}});
  $('#up').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const p=parseCSV(String(rd.result));if(!p||p.error){$('#upmsg').innerHTML='<span class="bad">'+(p?p.error:'The file is empty or not a CSV.')+'</span>';return}
   processing('Loading '+f.name,['Reading file','Detecting columns','Cleaning and validating','Updating demand history and models'],()=>{DATASET={name:f.name,rows:p.rows,source:'real'};runClean();const c=cleanRows(p.rows),n=applyDataset(c.rows);audit('Dataset uploaded: '+f.name+' ('+fmt(p.rows.length)+' rows)');if(n)audit('Models retrained on uploaded data for '+n+' materials');go('data');setTimeout(()=>{const m=$('#upmsg');if(m)m.innerHTML=n?`<span class="ok">Demand history updated for ${n} materials. All pages now use your data.</span>`:'Data cleaned. Not enough monthly records from 2023 to 2025 to update the demand models (30+ months per material needed).'},50)})};rd.readAsText(f)}}};

PAGES.recs={t:'AI Recommendations',render(){return`<div class="grid g2">${recs().map((r,i)=>`<div class="card"><div class="rw sp"><span class="tag">${r.mat}</span>${pill(r.tone==='hi'?'High':r.tone==='md'?'Medium':'Low').replace('>High<','>High priority<').replace('>Medium<','>Medium priority<').replace('>Low<','>Planned<')}</div><h3 style="font-size:16px;color:#fff;margin:10px 0 6px">${r.t}</h3><p class="mut" style="font-size:13px">${r.body}</p><p class="ok" style="font-size:13px;margin:8px 0">${r.ben}</p><button class="btn sm" data-accept="${i}">Mark as actioned</button></div>`).join('')}</div>`},

 <div class="grid g2"><div class="card"><h3>System health</h3>${[['Analytics engine (browser)','Running','ok'],['ML engine (in-browser charts)','Running','ok'],['Data pipeline','Running','ok'],['Python API (Flask)',OFFLINE?'Not running - built-in data (start with python run.py)':'Connected — /api/*',OFFLINE?'warn':'ok'],['Database (SQL)',OFFLINE?'Not connected':'Connected',OFFLINE?'warn':'ok']].map(([n,v,c])=>`<div class="rw sp" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${n}</span><span class="${c}" style="font-size:12.5px"><span class="dot" style="background:var(--${c})"></span>${v}</span></div>`).join('')}<h3 style="margin-top:16px">Model versioning</h3><div class="mono" style="font-size:12.5px">${FORECAST_SUMMARY?FORECAST_SUMMARY.materials.length:6} demand models (XGBRegressor) + 1 route-delay model (XGBClassifier) · see Settings → Model &amp; data health for live diagnostics</div></div>
 <div class="card"><h3>Audit log</h3><div style="max-height:250px;overflow:auto">${AUDIT.map(a=>`<div class="rw" style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px"><span class="mono mut">${a.at}</span><span>${a.t}</span><span class="mut" style="margin-left:auto;font-size:11.5px">${a.by||'System'}</span></div>`).join('')}</div></div></div>

const ADV_Q=['Why is Steelmate causing delays?','Which material has the highest stock-out risk?','What should we reorder this month?','What happens if demand increases by 20%?','Which supplier is most reliable?','How much could lead time improve?','Explain the demand forecast.','What are the major bottlenecks?'];
function advise(q){q=q.toLowerCase();const note=DATASET.source==='real'?'':'\n\n(Answer based on the built-in simulated dataset.)';let a;
 if(/supplier b|steel|steelmate/.test(q)&&/delay|late|why|cause/.test(q)){const s=SUPPLIERS[1];a=`${s.name} supplies steel rebar. Its on-time delivery is ${s.ontime}%, its average lead time is ${s.lead} days, and its risk score is ${s.risk}/100 — ${s.risk===Math.max(...SUPPLIERS.map(x=>x.risk))?'the highest of the '+SUPPLIERS.length+' suppliers':'above the network average'}. Supplier delays are also the largest bottleneck category in the 3-year history (${BCATS[0].total} events). ${s.rec}`}
 else if(/stock.?out|shortage|highest.*risk/.test(q)){const i=INV.slice().sort((a,b)=>b.pOut-a.pOut)[0];a=`${i.m.name} has the highest stock-out risk at ${f1(i.pOut)}%. Stock is ${fmt(i.stock)} ${i.m.unit} against a reorder point of ${fmt(i.rop)} and safety stock of ${fmt(i.ss)}.`}
 else if(/reorder|order this month|buy/.test(q)){const l=INV.filter(i=>i.status==='low'||i.status==='critical');a=l.length?'Reorder now:\n'+l.map(i=>`• ${i.m.name}: about ${fmt(Math.max(i.rop+i.ss-i.stock,0))} ${i.m.unit} (${i.status})`).join('\n'):'No material is below its reorder point.'}
 else if(/(\d+)\s*%/.test(q)&&/demand|increase|surge/.test(q)){const p=+q.match(/(\d+)\s*%/)[1]/100,r=INV.map(i=>{const sl=i.sdm/Math.sqrt(30)*Math.sqrt(i.m.lead)+1e-9,a1=(1-cdf((i.stock-i.fc/30*i.m.lead)/sl))*100,a2=(1-cdf((i.stock-i.fc*(1+p)/30*i.m.lead)/sl))*100;return{i,a1,a2}}).sort((x,y)=>y.a2-x.a2);a=`With demand up ${Math.round(p*100)}%, stock-out risk rises most for:\n`+r.slice(0,3).map(x=>`• ${x.i.m.name}: ${f1(x.a1)}% → ${f1(x.a2)}%`).join('\n')+'\nOpen the What-If Simulator to compare the current strategy with the AI strategy.'}
 else if(/reliab|best supplier|most/.test(q)){const s=SUPPLIERS.slice().sort((a,b)=>b.score-a.score)[0];a=`${s.name} is the most reliable: ${s.rel}% reliability, ${s.ontime}% on time, ${s.defect}% defects, risk ${s.risk}/100.`}
 else if(/lead/.test(q)){a=`Current average lead time is ${f1(totalOf(LEAD))} days. With AI routing, consolidation and rebalancing the simulation gives ${f1(OPT())} days — a ${f1(REDUCTION)}% reduction. The target is 8–10%.`}
 else if(/forecast|explain|predict/.test(q)){const F=forecast(S.mat,12),m=MAT(S.mat);a=`For ${m.name.toLowerCase()} the best model on held-out months is ${F.model.name} (accuracy ${f1(F.model.acc)}%). It expects ${fmt(sum(F.ft))} ${m.unit} over the next 12 months, peaking in ${MN[(36+F.ft.indexOf(Math.max(...F.ft)))%12]}. The forecast is driven by the long-run trend and a strong annual seasonal pattern.`}
 else if(/bottleneck/.test(q)){a='Top bottlenecks:\n'+TOP10.slice(0,4).map(b=>`• ${b.name} (score ${b.score}, ${b.days} days per event)`).join('\n')}
 else a='I can answer questions about suppliers, stock-out risk, reorders, demand changes, lead time, the forecast and bottlenecks. Try one of the suggestions below.';return a+(/Try one/.test(a)?'':note)}

/* ===================== hero scene: isometric construction "supply factory" =====================
   Copies the look and movement of the reference videos: a dark metal platform with a glowing
   edge, a conveyor carrying parts into a glass chamber full of glowing blocks, a "Building… /
   Testing… / Complete!" screen, a floating icon panel with a clicking cursor, finished cubes
   landing on an output pad, and orbit lines with a call-out box (HUD style). The parts are
   construction materials: cement bags, bricks, steel bars and diesel drums, plus a tower crane. */
function mountScene(canvas,hero){
 const ctx=canvas.getContext('2d');if(!ctx)return{dispose(){}};
 const C=.866,SN=.5;let W=0,H=0,S=10,ox=0,oy=0,raf=0,dead=false,last=performance.now(),T=0;
 const still=!anim();
 function size(){const r=hero.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);W=Math.max(300,r.width);H=Math.max(300,r.height);
  canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);
  const wide=W>=992;S=wide?Math.min(W*.60/25.4,H*.70/16):Math.min(W*.94/25.4,H*.34/16);
  ox=wide?W*.99-14.4*S:W*.03+11*S;oy=wide?H*.6:H*.76}
 size();const ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(size):null;ro&&ro.observe(hero);
 const P=(x,y,z)=>[ox+(x-y)*C*S,oy+(x+y)*SN*S-z*S*.82];
 const rgba=(c,a)=>`rgba(${c},${a})`;
 function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
 function line(a,b,col,lw){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.stroke()}
 /* box with three visible faces */
 function box(x,y,z,w,d,h,c,edge,alpha){const a=alpha==null?1:alpha;ctx.globalAlpha=a;
  const A=P(x,y,z+h),B=P(x+w,y,z+h),Cc=P(x+w,y+d,z+h),D=P(x,y+d,z+h);
  poly([D,Cc,P(x+w,y+d,z),P(x,y+d,z)],c[1],edge,1);poly([B,Cc,P(x+w,y+d,z),P(x+w,y,z)],c[2],edge,1);poly([A,B,Cc,D],c[0],edge,1);ctx.globalAlpha=1}
 const METAL=['#34302d','#1b1917','#0f0e0d'],LIGHT=['#e9e9e9','#bdbdbd','#8f8f8f'],GOLD=['#ffd23a','#d9a400','#a97c00'],WHITE=['#ffffff','#d6d6d6','#a8a8a8'];
 const EDGE='rgba(255,220,170,.55)';
 /* plane transform: local (u,v) 1/50 tile units on the horizontal plane at height z */
 function plane(x,y,z,fn){const p=P(x,y,z),K=50;ctx.save();ctx.transform(C*S/K,SN*S/K,-C*S/K,SN*S/K,p[0],p[1]);fn(K);ctx.restore()}

 /* ---- state ---- */
 const items=[],cubes=[],parts=[];let spawnT=0,delivered=0,slotN=0,fade=1,clickT=0;
 const KINDS=['cement','brick','steel','drum'],NAMES={cement:'CEMENT',brick:'BRICKS',steel:'STEEL',drum:'DIESEL'};
 for(let i=0;i<46;i++)parts.push({x:Math.random()*3-1,y:Math.random()*3-1,z:Math.random()*3,v:.3+Math.random()*.8,p:Math.random()*6});
 function spawn(){items.push({k:KINDS[(delivered+items.length)%4],x:-8.2,y:0,t:0})}
 function drawItem(it,alpha){const z=.62,x=it.x,k=it.k;
  if(k==='cement')box(x-.45,-.3,z,.9,.6,.34,LIGHT,'#222',alpha);
  else if(k==='brick'){box(x-.4,-.28,z,.8,.56,.14,['#b4532a','#8a3b1d','#6a2d16'],'#2a120a',alpha);box(x-.4,-.28,z+.14,.8,.56,.14,['#c4623a','#9a4624','#7a3a1c'],'#2a120a',alpha)}
  else if(k==='steel'){for(let i=0;i<3;i++)box(x-.7,-.32+i*.26,z,1.4,.16,.16,['#6d7480','#444a54','#2c3037'],'#111',alpha)}
  else{box(x-.25,-.25,z,.5,.5,.72,['#2f5d8c','#1f4163','#16304a'],'#0b1b2b',alpha);box(x-.26,-.26,z+.3,.52,.52,.1,GOLD,'#442',alpha)}}
 function drawCube(c){const x=c.x,y=c.y,z=c.z;box(x-.5,y-.5,z,1,1,.9,c.w?WHITE:GOLD,'#3a2a00');
  plane(x-.5,y-.5,z+.9,K=>{ctx.fillStyle='rgba(0,0,0,.78)';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(c.w?'PO':'APP',25,24);ctx.font='9px monospace';ctx.fillText(c.l,25,38)});
 }
 /* ---- crane ---- */
 function crane(t){const bx=5.4,by=-6.8,top=7.4,th=Math.sin(t*.35)*.5+.55,L=5.2,tx=bx+Math.cos(th)*L,ty=by+Math.sin(th)*L,cx=bx-Math.cos(th)*2.2,cy=by-Math.sin(th)*2.2;
  const dk='#141210',lt='rgba(20,18,16,.9)';
  box(bx-.55,by-.55,0,1.1,1.1,.5,METAL,EDGE);
  for(let z=.5;z<top;z+=.9){const a=P(bx-.2,by-.2,z),b=P(bx+.2,by+.2,z+.9),c2=P(bx+.2,by-.2,z),d=P(bx-.2,by+.2,z+.9);line(a,b,lt,1.2);line(c2,d,lt,1.2)}
  [[-.2,-.2],[.2,-.2],[.2,.2],[-.2,.2]].forEach(o=>line(P(bx+o[0],by+o[1],.5),P(bx+o[0],by+o[1],top),dk,2));
  const jt=P(tx,ty,top),jb=P(bx,by,top),jc=P(cx,cy,top),ap=P(bx,by,top+1.8);
  line(jb,jt,dk,3);line(jb,jc,dk,3);line(ap,jt,lt,1);line(ap,jc,lt,1);line(P(bx,by,top),ap,dk,2);
  box(cx-.45,cy-.45,top-.2,.9,.9,.6,METAL,EDGE);
  const u=.55+.2*Math.sin(t*.5),hx=bx+(tx-bx)*u,hy=by+(ty-by)*u,hz=top-3.3-Math.sin(t*.8)*.7,sw=Math.sin(t*1.7)*.12;
  const tp=P(hx,hy,top),hp=P(hx+sw,hy,hz);line(tp,hp,'rgba(20,18,16,.85)',1.2);box(hx+sw-.7,hy-.12,hz-.2,1.4,.24,.2,['#6d7480','#444a54','#2c3037'],'#111');ctx.fillStyle=dk;ctx.beginPath();ctx.arc(hp[0],hp[1],3,0,7);ctx.fill()}

/* ===================== sign-in that always works =====================
   1. Normal mode: the page is served by Flask (python run.py) and signs in against /api/auth/login.
   2. Fallback: if the page is opened straight from disk or from a plain file server (no API),
      the same accounts are checked in the browser against salted SHA-256 hashes, so you can
      still sign in, look around every dashboard and sign out. Passwords are never shown or stored in plain text. */

   <h1 class="display-4 fw-bolder lh-1 mb-3">Intelligent supply chains. <span class="u">Measurable results.</span></h1>
   <p class="lead mb-4">Leengate brings procurement, supplier, warehouse and transport data into one platform, predicts material demand and warns you early about late routes and low stock.</p>
   <div class="d-flex flex-wrap gap-2"><button class="btn btn-dark btn-lg fw-bold hard" type="button" data-login>Sign in to the platform</button><a class="btn btn-light btn-lg fw-bold hard" href="#dash">See the dashboards</a></div></div></div></div>
  <div class="hud hud-bl mono"><div class="d-flex align-items-end gap-3 flex-wrap"><div><div class="hud-sub">MATERIAL ORDERS PROCESSED:</div><div class="odo" id="odo">000.000.000</div></div><div><div class="hud-sub">TIME REFERENCE:</div><div class="odo" id="odoY">2023</div></div><div class="flex-grow-1 hud-spark">${spark2}</div></div></div>
  <div class="hud hud-br mono d-none d-md-block"><span id="hudStage">BUILDING</span> &nbsp; ALL SYSTEM : ACTIVE</div></section>
 <section class="py-5" id="stats"><div class="container"><div class="row g-4">
  <div class="col-md-4"><div class="card tilt p-4 h-100"><div class="d-flex justify-content-between"><span class="pro-badge">HEALTH</span><span class="pro-badge b-dark">LIVE</span></div><div class="display-4 fw-bolder mt-3"><span data-count="${KPI.health}">0</span>/100</div><p class="mono small mb-2">Supply chain health - AI engine online</p><div class="progress" style="height:8px"><div class="progress-bar" style="width:${KPI.health}%"></div></div></div></div>
  <div class="col-md-4"><div class="card tilt p-4 h-100"><div class="d-flex justify-content-between"><span class="pro-badge">ROUTES</span><span class="pro-badge b-amber">MONITOR</span></div><div class="display-4 fw-bolder mt-3"><span data-count="${riskRoutes}">0</span></div><p class="mono small mb-2">Delivery routes at risk of delay</p><button class="btn btn-dark btn-sm fw-bold" type="button" data-login>Reroute via Route 2 →</button></div></div>
  <div class="col-md-4"><div class="card tilt p-4 h-100"><div class="d-flex justify-content-between"><span class="pro-badge">STOCK</span><span class="pro-badge b-red">ACTION</span></div><div class="display-4 fw-bolder mt-3"><span data-count="${low.length}">0</span></div><p class="mono small mb-2">Materials at or below reorder point</p><div class="d-flex flex-wrap gap-1">${low.slice(0,4).map(i=>`<span class="badge text-bg-dark">${i.m.name}</span>`).join('')}</div></div></div></div></div></section>
 <section class="py-5" id="how"><div class="container"><h2 class="fw-bolder mb-1">How the AI engine works</h2><p class="mono small mb-4">Same flow you see in the animation: materials in, intelligence in the middle, decisions out.</p>
  <div class="row g-4">${[['1','Collect','Procurement, supplier, inventory, transport and production records flow in on the conveyor - 36 months of history.'],['2','Build & test','The AI engine cleans the data, trains forecasting models, tests them on held-out months and measures accuracy.'],['3','Decide','Finished decisions land on the output pad: what to order, when, from whom and by which route.']].map(c=>`<div class="col-md-4"><div class="card tilt p-4 h-100"><div class="step-no">${c[0]}</div><h4 class="fw-bold mt-2">${c[1]}</h4><p class="mb-0">${c[2]}</p></div></div>`).join('')}</div></div></section>
 <section class="py-5" id="dash"><div class="container"><h2 class="fw-bolder mb-1">Dashboards</h2><p class="mono small mb-4">Six departments, each sees only its own data. Sign in to open yours.</p>
  <div class="row g-3">${DASHBOARDS.map(d=>`<div class="col-sm-6 col-lg-3"><div class="card tilt p-3 h-100"><h6 class="fw-bold">${d[0]}</h6><p class="small mb-0">${d[1]}</p></div></div>`).join('')}</div></div></section>
 <section class="py-5" id="sites"><div class="container"><h2 class="fw-bolder mb-1">Construction site operations</h2><p class="mono small mb-4">The work this platform keeps supplied.</p>
  <div class="row g-4">${[['Crew & crawler crane','Workers in safety gear monitoring a heavy lift.',0],['Signal operator','Hand signals directing the tower-crane operator.',1],['Beam lift','Mobile crane lifting a precast concrete beam.',2]].map(c=>`<div class="col-md-4"><div class="card tilt overflow-hidden"><img src="${SITE_IMG[c[2]]}" class="w-100" style="height:230px;object-fit:cover" alt="${c[0]}"><div class="p-3"><h5 class="fw-bold">${c[0]}</h5><p class="small mb-0">${c[1]}</p></div></div></div>`).join('')}</div></div></section>
 <footer class="py-4 lg-foot"><div class="container d-flex flex-wrap justify-content-between gap-2 small"><span><b>LEENGATE</b> Construction &amp; Plant Hire · Harare, Zimbabwe</span><span>AI-driven supply chain optimisation - final-year research system</span></div></footer>`}

let scn=null,hudTimer=null;
function startHud(){clearInterval(hudTimer);const clock=$('#hudClock'),odo=$('#odo'),oy=$('#odoY'),ty=$('#typer'),evD=$('#evDate'),evT=$('#evText'),head=$('#hudHead'),stg=$('#hudStage');if(!clock)return;
 const base=Math.round(sum(MATERIALS.map(m=>sum(m.series)))/12),txt='[SUPPLY CHAINS ARE THE FOUNDATION OF CONSTRUCTION]';let n=0,e=0,t0=Date.now();
 const tick=()=>{if(!clock.isConnected){clearInterval(hudTimer);return}
  const d=new Date();clock.textContent=d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-US');
  if(n<txt.length){n++;ty.textContent=txt.slice(0,n)+(n<txt.length?'_':'')}
  const el=(Date.now()-t0)/1000,k=(el%36)/36,v=base+Math.round(k*base*.9)+(scn?scn.delivered*137:0),s=String(v).padStart(9,'0');odo.textContent=s.slice(0,3)+'.'+s.slice(3,6)+'.'+s.slice(6);
  oy.textContent=String(2023+Math.min(2,Math.floor(k*3)));if(head){const x=k*520;head.setAttribute('x1',x);head.setAttribute('x2',x)}
  if(stg&&scn)stg.textContent=scn.stage();
  const ei=Math.floor(el/6)%EVENTS.length;if(ei!==e){e=ei;if(evD){evD.textContent=EVENTS[e][0];evT.textContent=EVENTS[e][1]}}};
 tick();hudTimer=setInterval(tick,anim()?60:1000)}
function tiltCards(root){if(!anim()||matchMedia('(pointer: coarse)').matches)return;$$('.tilt',root).forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*9).toFixed(2)}deg) translateZ(8px)`});c.addEventListener('pointerleave',()=>{c.style.transform=''})})}

/* ===================== router ===================== */
let curPage=null,globe=null;
function stopViews(){if(S.twin&&S.twin.dispose){S.twin.dispose();S.twin=null}if(globe){globe.dispose();globe=null}if(scn){scn.dispose();scn=null}clearInterval(hudTimer)}
function showLand(){stopViews();curPage=null;wipeApp();$('#app').hidden=true;$('#gate').hidden=true;const l=$('#land');l.hidden=false;l.innerHTML=landing();countUp(l);document.title='Leengate — Intelligent supply chains. Measurable results.';window.scrollTo(0,0);scn=mountScene($('#scene'),$('#hero'));startHud();tiltCards(l)}
function renderApp(id){if(!ROLE){showGate(id);return}if(!PAGES[id]||!canAccess(id))id=ROLE_HOME[ROLE];stopViews();curPage=id;$('#land').hidden=true;$('#gate').hidden=true;$('#app').hidden=false;setRoleClass('role-'+ROLE);const P=PAGES[id];$('#ttl').textContent=P.t;document.title=P.t+' — Leengate';
 $('#side').innerHTML=`<a class="logo" href="#/"><img src="${LOGO_IMG}" alt="Leengate" style="height:28px;display:block"></a>`+NAV.filter(n=>canAccess(n[0])).map(n=>`<a class="nv ${n[0]===id?'on':''}" href="#/app/${n[0]}" ${n[0]===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[n[2]]}</svg>${n[1]}</a>`).join('')+`<div style="margin-top:auto;padding:14px 10px"><span class="tag">Final-year research system</span></div>`;$('#side').classList.remove('open');
 if(USER){$('#roleTag').style.display='inline-flex';$('#roleTag').textContent=roleLabel(ROLE)}else{$('#roleTag').style.display='none'}
 $('#signout').style.display=USER?'inline-flex':'none';
 $('#view').innerHTML=P.render();P.init&&P.init();countUp($('#view'));tiltCards($('#view'));window.scrollTo(0,0)}
function go(p){if(location.hash==='#/app/'+p){renderApp(p);return}try{location.hash='#/app/'+p}catch(e){}setTimeout(()=>{if(curPage!==p)renderApp(p)},60)}
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');if(['stats','how','dash','sites'].includes(h[0])){if($('#land').hidden)showLand();const el=document.getElementById(h[0]);el&&el.scrollIntoView({behavior:'smooth'});return}if(h[0]==='app'){if(!ROLE){showGate(h[1]);return}const id=canAccess(h[1])?(h[1]||ROLE_HOME[ROLE]||'command'):ROLE_HOME[ROLE];if(curPage===id&&!$('#app').hidden)return;renderApp(id)}else if(h[0]==='gate'){showGate(h[1])}else showLand()}
window.addEventListener('hashchange',route);
function resyncSession(){apiGet('/auth/me').then(d=>{USER=d.user;ROLE=d.user.role;return bootData().catch(()=>{})}).catch(()=>{USER=null;ROLE=null}).finally(route)}
window.addEventListener('pageshow',e=>{if(e.persisted)resyncSession()});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav],[data-go]');if(n)go(n.dataset.nav||n.dataset.go);const a=e.target.closest('[data-act="optimise"]');if(a)processing('AI optimisation',['Loading historical data','Detecting bottlenecks','Rerouting delayed shipments','Rebalancing inventory','Generating recommendations'],()=>{audit('AI optimisation run');S.twin&&S.twin.optimise()})});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-go]'))go(e.target.dataset.go)});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#signout').onclick=signOut;
document.body.classList.toggle('reduce',REDUCE);
$('#loginForm').onsubmit=doLogin;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-login]');if(b){e.preventDefault();openLogin()}});

resyncSession();


</script>
